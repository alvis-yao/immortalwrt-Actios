name: Compile OpenWrt Firmware

on:
  # 允许手动触发编译，并显示交互界面
  workflow_dispatch:
    inputs:
      # 选项 1：选择预置的编译型号（你可以按需修改这里的列表）
      target_model:
        description: '选择编译型号'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - lede
          - openwrt
      # 选项 2：上传自定义的 .config 文件（如果选此选项，目标型号将被忽略）
      upload_config:
        description: '上传你的 .config 文件 (可选)'
        required: false
        type: string
        default: ''
      # 选项 3：需要额外添加的插件/软件包
      extra_packages:
        description: '额外安装的插件(多个用空格隔开，如: luci-app-passwall luci-app-adguardhome)'
        required: false
        type: string
        default: ''

  # 允许仓库调度触发
  repository_dispatch:
    types: [compile]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Compile Firmware (${{ github.event.inputs.target_model }})
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            git \
            gettext \
            libncurses-dev \
            libssl-dev \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            time \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clean build environment
        run: |
          make clean
          rm -rf build_dir staging_dir target/ dl/

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify libffi dependency
        run: |
          if [ -d "./feeds/packages/libs/libffi" ]; then
            echo "✅ libffi dependency found successfully!"
          else
            echo "❌ Critical Error: libffi package is missing in feeds!"
            echo "Please ensure your source code (fork) is synced with the latest upstream."
            exit 1
          fi

      - name: Load Custom Configuration
        run: |
          # 逻辑修改：优先使用你在 Actions 界面上传的 .config，如果没有则使用仓库默认的
          if [ -n "${{ github.event.inputs.upload_config }}" ]; then
            echo "📥 Using user-uploaded .config..."
            echo "${{ github.event.inputs.upload_config }}" > .config
          else
            echo "📥 Using repository default .config..."
            cp .config .config_original
          fi

      - name: Modify config & add packages
        run: |
          # 自动添加用户在界面填写的插件
          if [ -n "${{ github.event.inputs.extra_packages }}" ]; then
            echo "Adding extra packages: ${{ github.event.inputs.extra_packages }}"
            for package in ${{ github.event.inputs.extra_packages }}; do
              sed -i "s/# CONFIG_PACKAGE_${package} is not set/CONFIG_PACKAGE_${package}=m/g" .config
            done
          fi

      - name: Make defconfig
        run: |
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          echo "Starting compile firmware..."
          make -j$(nproc) V=s
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Debug SSH (On failure)
        if: ${{ steps.compile.outcome == 'failure' }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ github.actor }}

      - name: Upload Bin Directory
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Bin-Directories
          path: ./bin

      - name: Generate Release Tag
        id: generate_tag
        run: |
          echo "release_tag=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_date=$(date '+%Y年%m月%d日 %H点%M分')" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
        if: steps.compile.outputs.status == 'success'

      - name: Generate File List
        id: file_list
        run: |
          echo "### Firmware Information" >> release.md
          echo "" >> release.md
          echo "🔢 Firmware version: ${{ steps.generate_tag.outputs.release_tag }}" >> release.md
          echo "📅 Date: ${{ steps.generate_tag.outputs.release_date }}" >> release.md
          echo "👨‍💻 Author: ${{ github.actor }}" >> release.md
          echo "🏠 Repository: ${{ github.repository }}" >> release.md
          echo "⚙️ Compile Workflow: ${{ github.workflow }}" >> release.md
          echo "" >> release.md
          echo "### Firmware List" >> release.md
          echo "" >> release.md
          for i in bin/targets/*/*/*.img.gz; do
            echo "🔹 $i" >> release.md
          done
          for i in bin/targets/*/*/*.ext4.gz; do
            echo "🔹 $i" >> release.md
          done
          for i in bin/targets/*/*/*.rootfs.tar.gz; do
            echo "🔹 $i" >> release.md
          done
          echo "status=success" >> $GITHUB_OUTPUT
        if: steps.compile.outputs.status == 'success'

      - name: Upload Firmware to Release
        uses: ncipollo/release-action@v1
        if: steps.compile.outputs.status == 'success'
        with:
          artifacts: "bin/targets/*/*/*.img.gz,bin/targets/*/*/*.ext4.gz,bin/targets/*/*/*.rootfs.tar.gz,bin/targets/*/packages/*.ipk"
          name: "OpenWrt Release ${{ steps.generate_tag.outputs.release_tag }}"
          tag: ${{ steps.generate_tag.outputs.release_tag }}
          bodyFile: "release.md"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 1
