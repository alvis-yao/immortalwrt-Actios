name: Compile OpenWrt Firmware

on:
  # 允许手动触发编译
  workflow_dispatch:
  # 允许通过仓库调度触发 (例如通过 API 或仓库事件)
  repository_dispatch:
    types: [compile]

env:
  # 定义 GitHub API 的认证 Token，用于删除旧的运行记录
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # 关键修复：获取完整的 Git 历史记录，确保子模块能正确更新
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            git \
            gettext \
            libncurses-dev \
            libssl-dev \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            time \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clean build environment
        run: |
          # 清理可能存在的旧构建缓存和脏数据
          make clean
          rm -rf build_dir staging_dir target/ dl/

      - name: Update Feeds
        run: |
          # 更新所有 feeds
          ./scripts/feeds update -a
          # 关键修复：移除了 -f 参数，强制检查依赖，防止掩藏 libffi 缺失的错误
          ./scripts/feeds install -a

      - name: Verify libffi dependency
        run: |
          # 关键修复：编译前检查 libffi 包是否存在
          if [ -d "./feeds/packages/libs/libffi" ]; then
            echo "✅ libffi dependency found successfully!"
          else
            echo "❌ Critical Error: libffi package is missing in feeds!"
            echo "Please ensure your source code (fork) is synced with the latest upstream."
            exit 1
          fi

      - name: Load Custom Config
        run: |
          # 确保你的仓库根目录下有 .config 文件，或者在这里使用 curl/wget 下载
          [ -f .config ] && mv .config .config.bak
          # 你可以在这里放你的 config 内容，或者在 Actions Secrets/Variables 里配置
          # 如果你把 .config 放在了仓库里，这行不需要动；如果是 secrets，使用以下方式：
          # echo "${{ secrets.CONFIG_FILE }}" > .config
          
      - name: Make defconfig
        run: |
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          echo "Starting compile firmware..."
          make -j$(nproc) V=s
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Debug SSH (On failure)
        if: ${{ steps.compile.outcome == 'failure' }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60
        with:
          limit-access-to-actor: true
          limit-access-to-users: ${{ github.actor }}

      - name: Upload Bin Directory
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Bin-Directories
          path: ./bin

      - name: Generate Release Tag
        id: generate_tag
        run: |
          echo "release_tag=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_date=$(date '+%Y年%m月%d日 %H点%M分')" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
        if: steps.compile.outputs.status == 'success'

      - name: Generate File List
        id: file_list
        run: |
          echo "### Firmware Information" >> release.md
          echo "" >> release.md
          echo "🔢 Firmware version: ${{ steps.generate_tag.outputs.release_tag }}" >> release.md
          echo "📅 Date: ${{ steps.generate_tag.outputs.release_date }}" >> release.md
          echo "👨‍💻 Author: ${{ github.actor }}" >> release.md
          echo "🏠 Repository: ${{ github.repository }}" >> release.md
          echo "⚙️ Compile Workflow: ${{ github.workflow }}" >> release.md
          echo "" >> release.md
          echo "### Firmware List" >> release.md
          echo "" >> release.md
          for i in bin/targets/*/*/*.img.gz; do
            echo "🔹 $i" >> release.md
          done
          for i in bin/targets/*/*/*.ext4.gz; do
            echo "🔹 $i" >> release.md
          done
          for i in bin/targets/*/*/*.rootfs.tar.gz; do
            echo "🔹 $i" >> release.md
          done
          echo "status=success" >> $GITHUB_OUTPUT
        if: steps.compile.outputs.status == 'success'

      - name: Upload Firmware to Release
        uses: ncipollo/release-action@v1
        if: steps.compile.outputs.status == 'success'
        with:
          artifacts: "bin/targets/*/*/*.img.gz,bin/targets/*/*/*.ext4.gz,bin/targets/*/*/*.rootfs.tar.gz,bin/targets/*/*/packages/*.ipk"
          name: "OpenWrt Release ${{ steps.generate_tag.outputs.release_tag }}"
          tag: ${{ steps.generate_tag.outputs.release_tag }}
          bodyFile: "release.md"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 1
