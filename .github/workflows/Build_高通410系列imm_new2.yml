#
#

name: 🚀 Build_高通410系列imm_new2

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
        default: ufi003
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 指定 hash（默认不用填写）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加任何额外包）↓ '
        required: false
        default: ''
        type: string

env:
  # 统一默认值：repository_dispatch 触发时 inputs 全为空，原来会 clone 一个空地址
  REPO_URL: https://github.com/${{ github.event.inputs.upstream || 'lkiuyu/immortalwrt' }}
  REPO_BRANCH: master
  PROFILE: ${{ github.event.inputs.profile || 'ufi003' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/${{ github.event.inputs.profile || 'ufi003' }}.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.0
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        DEPS=$(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt || true)
        if [ -z "$DEPS" ]; then
          echo "::error::依赖列表拉取失败，检查网络"
          exit 1
        fi
        sudo -E apt-get -y install $DEPS
        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT

    - name: mkbootimg build
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "mkbootimg found at: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg not found in PATH!"
        fi

    - name: Ensure Python build tools
      run: |
        python3 -m pip cache purge
        python3 -m pip install --upgrade --force-reinstall pip
        python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
        python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
        python3 -m pip install --upgrade cython packaging tomli
        python3 -m pip install Unidecode pyelftools
        python3 -m pip --version
        python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

    - name: 读取锁定的上游 hash (Read locked upstream hash)
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "使用用户指定 hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "使用锁定 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "upstream_lock.txt 不存在，使用最新 master"
        fi

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt

    # ==========================================================
    # 关键修复：lkiuyu/immortalwrt 的 package/libs 下没有 libffi，
    # 而 feeds/packages/glib2 的 glib2-gobject / glib2-gio 硬依赖 +libffi
    # （host 构建还要 libffi/host）。缺包会导致：
    #   WARNING: ... has a dependency on 'libffi', which does not exist
    #   Package glib2-gobject is missing dependencies for: libffi.so.8
    # 该包在官方 immortalwrt 里只有一个 Makefile（3.4.x），直接取回即可。
    # ==========================================================
    - name: Patch upstream (补回 libffi)
      run: |
        cd openwrt
        if [ -f package/libs/libffi/Makefile ]; then
          echo "✅ 上游已自带 libffi，跳过"
        else
          mkdir -p package/libs/libffi
          if curl -fsSL --retry 3 --retry-delay 2 \
              https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/libs/libffi/Makefile \
              -o package/libs/libffi/Makefile \
             && grep -q '^PKG_NAME:=libffi' package/libs/libffi/Makefile; then
            echo "✅ 已补回 libffi：$(grep '^PKG_VERSION' package/libs/libffi/Makefile)"
          else
            rm -f package/libs/libffi/Makefile
            echo "::error::libffi 补丁失败，glib2 打包必然再次报 libffi.so.8 缺失"
            exit 1
          fi
        fi

    - name: Load custom files
      run: |
        if [ -d files ]; then
          mkdir -p openwrt/files
          cp -r files/. openwrt/files/
          echo "✅ 已注入 files/"
        else
          echo "无 files 目录，跳过"
        fi

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove conflicting packages from smpackage
      run: |
        # 删除 small-package 中与系统冲突的包，避免编译报错（官方推荐操作）
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    # 注意：这里不要再 mv files，files 已在上面的步骤注入，
    # 原来的 `mv files openwrt/files` 会产成 openwrt/files/files 套娃。
    - name: Load custom configuration
      run: |
        cd openwrt
        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          echo "✅ 使用配置: $CONFIG_FILE"
        else
          echo "::warning::找不到 $CONFIG_FILE，将使用上游默认配置"
        fi
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # 用户输入走 env 传参，避免单引号/反引号注入
    - name: Install extra packages
      if: ${{ env.EXTRA_PACKAGES != '' }}
      run: |
        cd openwrt
        RAW="$EXTRA_PACKAGES"
        echo "=========================================="
        echo "User requested extra packages:"
        echo "$RAW"
        echo "=========================================="

        # 提取系统设置参数（__ip__ 和 __hostname__ 前缀）
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        # 应用自定义 IP
        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.1\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        # 应用自定义主机名
        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        # 过滤掉特殊前缀，只处理真正的包名
        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')

        # 检测是否选了 turboacc，如果选了则先执行安装脚本
        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "✅ Enabled (replaced): ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "✅ Enabled (updated): ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "✅ Enabled (appended): ${CFG}=y"
            fi
          fi
        done

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: mxschmitt/action-tmate@v3
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: Config defconfig
      id: config
      run: |
        cd openwrt
        make defconfig

    - name: Sanity check libffi
      run: |
        cd openwrt
        test -f package/libs/libffi/Makefile || { echo "::error::libffi 包缺失"; exit 1; }
        grep -q '^PKG_NAME:=libffi' package/libs/libffi/Makefile || { echo "::error::libffi Makefile 异常"; exit 1; }
        echo "libffi 包已就位"
        grep -E 'CONFIG_PACKAGE_(libffi|glib2)' .config || echo "::warning::配置里没有 libffi/glib2，说明本次不会触发该依赖"

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j4 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 查看 openwrt 目录
      run: |
        ls -la openwrt/
        ls -l openwrt/.config

    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@v4
      with:
        name: build-config
        path: |
          ${{ github.workspace }}/openwrt/.config
          ${{ github.workspace }}/openwrt/feeds.conf.default
        include-hidden-files: true

    # 原来的 `make -jN || make -j1` 会吞掉并行编译错误，
    # -j1 侥幸成功还会误判为 success，这里改成硬失败 + 只留日志尾巴。
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        if ! make -j$(nproc) V=s > build.log 2>&1; then
          echo "::error::编译失败，最后 200 行日志："
          tail -n 200 build.log
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: openwrt/build.log
        if-no-files-found: ignore

    - name: Get kernel version
      if: steps.compile.outputs.status == 'success'
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Fix Git buffer
      run: git config --global http.postBuffer 524288000

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # 原条件是 `!cancelled()`，编译失败也会进来，于是报“固件文件未找到”这个二次伤害
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages

        # 创建刷机包目录并打包 zip
        mkdir -p flash_package
        for IMG in boot system; do
          SRC=$(ls *${IMG}.img.gz *${IMG}.img 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::缺少 ${IMG}.img，当前目录："
            ls -la
            exit 1
          fi
          case "$SRC" in
            *.gz) gzip -dc "$SRC" > flash_package/${IMG}.img ;;
            *)    cp "$SRC" flash_package/${IMG}.img ;;
          esac
          echo "✅ ${IMG}.img <= $SRC"
        done

        if [ -d "$GITHUB_WORKSPACE/刷机脚本" ]; then
          cp -r "$GITHUB_WORKSPACE/刷机脚本/." flash_package/
        else
          echo "::warning::缺少 刷机脚本 目录"
        fi

        # 确保 bat 文件是 CRLF 换行（Windows 兼容）
        if ls flash_package/*.bat >/dev/null 2>&1; then
          sed -i 's/\r$//' flash_package/*.bat
          sed -i 's/$/\r/' flash_package/*.bat
        fi

        ZIP_NAME="OpenWrt_${PROFILE}${{ env.FILE_DATE }}_刷机包.zip"
        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

        # 整理 release 目录：zip + 单独固件 + 编译信息
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true

        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        RAW="$EXTRA_PACKAGES"
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.1.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        # 过滤掉特殊前缀，只显示真正的包名
        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')

        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master分支 高通410系列 · ${PROFILE}"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空 |"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### 额外添加的包"
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### 额外添加的包"
            echo "无"
          fi
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }

    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [ -z "$DEL_IDS" ]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
